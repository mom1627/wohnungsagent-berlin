name: Daily housing agent - unified pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,11,16 * * *'
permissions:
  contents: read
jobs:
  housing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover and screen inBerlinWohnen offers
        run: python daily_housing_agent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-housing-report
          path: daily_housing_report.json
          if-no-files-found: ignore
          retention-days: 14
