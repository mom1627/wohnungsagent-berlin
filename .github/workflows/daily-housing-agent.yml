name: Daily housing agent - unified pipeline
# The repository is public, so GitHub-hosted minutes are not metered. Runs
# every two hours between 06:17 and 22:17 Berlin time; the concurrency group
# below prevents overlapping runs. The read-only helper workflows are manual.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6-22/2 * * *'
      timezone: Europe/Berlin
permissions:
  contents: write
concurrency:
  group: housing-agent-production
  cancel-in-progress: false
jobs:
  housing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/daily-housing-agent.yml
      - run: python -m pip install playwright==1.56.0 lxml==6.1.1 Protego==0.7.0
      - name: Unit and safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Install and verify Chromium
        timeout-minutes: 4
        run: |
          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              browser.close()
          PY
      - name: Discover all pages and inspect matching offers
        env:
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          APPLICANT_HOUSING_PROFILE: ${{ secrets.APPLICANT_HOUSING_PROFILE }}
          APPLICANT_WBM_DATA_CONSENT: ${{ secrets.APPLICANT_WBM_DATA_CONSENT }}
          APPLICANT_MONTHLY_NET_INCOME: ${{ secrets.APPLICANT_MONTHLY_NET_INCOME }}
          APPLICANT_WBS_ISSUED_ON: ${{ secrets.APPLICANT_WBS_ISSUED_ON }}
          APPLICANT_WBS_AUTHORIZED_ROOMS: ${{ secrets.APPLICANT_WBS_AUTHORIZED_ROOMS }}
          APPLICANT_EARLIEST_MOVE_IN: ${{ secrets.APPLICANT_EARLIEST_MOVE_IN }}
          GH_STATE_TOKEN: ${{ github.token }}
          ENABLE_LIVE_APPLICATIONS: '1'
        run: python daily_housing_agent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-housing-report
          path: |
            daily_housing_report.json
            daily_housing_report.md
          if-no-files-found: warn
          retention-days: 14

