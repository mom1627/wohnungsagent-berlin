name: Check authorized housing feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOUSING_FEED_URL: ${{ vars.HOUSING_FEED_URL }}
      FEED_ALLOWED_HOSTS: ${{ vars.FEED_ALLOWED_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Screen approved feed (read-only)
        run: python run_feed.py
