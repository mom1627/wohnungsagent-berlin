name: Inspect dynamic Gewobag application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Inspect browser-rendered public offer pages (read only)
        run: python inspect_dynamic_application.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-application-inspection
          path: dynamic_application_inspection.json
          if-no-files-found: ignore
          retention-days: 7
